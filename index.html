<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5cc4f0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Malin Kundang: The Moral Adventure</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status">
        <strong>Malin Kundang</strong>
        <span class="boot-dots" aria-hidden="true">● ● ●</span>
        <span>Menyiapkan petualangan…</span>
      </div>
    </div>
    <style>
      .boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 22px; align-items: center; justify-content: center; background: linear-gradient(#0798e2, #65cdf2 65%, #079eaf); color: #fff5db; font: 18px 'Trebuchet MS', sans-serif; text-align: center; }
      .boot-splash strong { font-size: clamp(32px, 7vw, 64px); text-shadow: 0 4px #087ba4; }
      .boot-dots { color: #ffcf4b; letter-spacing: 8px; animation: boot-pulse 1s ease-in-out infinite alternate; }
      @keyframes boot-pulse { to { opacity: .35; transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .boot-dots { animation: none; } }
    </style>
    <noscript>Aktifkan JavaScript di browser untuk memainkan Malin Kundang.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
